<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>장보러 가는 할머니!</title></head><body style="background:#151b25;color:white;font:16px system-ui;text-align:center;padding-top:30vh"><p id="load">장보러 가는 할머니 V10 불러오는 중…</p><script>
function patchHalmae(s){
 const edit=(a,b,v)=>{let i=s.indexOf(a),j=s.indexOf(b,i);if(i<0||j<0)throw Error('V9 source mismatch: '+a);s=s.slice(0,i)+v+s.slice(j)};
 const one=(a,b)=>{if(!s.includes(a))throw Error('V9 source mismatch: '+a);s=s.replace(a,b)};
 one('CANE=202,ARM=68','CANE=300,ARM=68');
 edit('const STICK_REACH=CANE+31;','// Roof and fixture contacts',`const STICK_REACH=180, MIN_REACH=88, MAX_REACH=348;
 let reach=STICK_REACH, reachTarget=STICK_REACH;
 const gripAt=(tip,sh)=>{
  const dx=tip.x-sh.x,dy=tip.y-sh.y,d=Math.hypot(dx,dy)||1,ux=dx/d,uy=dy/d;
  const hand={x:sh.x+ux*ARM,y:sh.y+uy*ARM};
  return {angle:Math.atan2(uy,ux),hand,base:{x:tip.x-ux*CANE,y:tip.y-uy*CANE},tip};
 };
 const freePose=ang=>{const sh=shoulder();return gripAt({x:sh.x+Math.cos(ang)*reach,y:sh.y+Math.sin(ang)*reach},sh)};
 `);
 one('d<Math.abs(CANE-ARM)+7||d>CANE+ARM-5','d<MIN_REACH||d>MAX_REACH');
 one('state.aimTarget=state.aim;\n state.power=0;tone','state.aimTarget=state.aim;reach=reachTarget=state.plant.radius;\n state.power=0;tone');
 edit(' // Swung momentum and stored elastic work',' return true;\n}',` // Release preserves the measured contact-driven momentum, as in Halbae.
 p.vx=clamp(p.vx,-455,455);p.vy=clamp(p.vy,-650,650);
 `);
 one('Math.cos(a)*STICK_REACH,y:sh.y+Math.sin(a)*STICK_REACH','Math.cos(a)*reach,y:sh.y+Math.sin(a)*reach');
 edit('function moveCaneByFinger(e){',"cv.addEventListener('pointerdown'",`function moveCaneByFinger(e){
 const t=state.gesture;if(!t)return;
 const dx=(e.clientX-t.lastX)/scale*1.35,dy=(e.clientY-t.lastY)/scale*1.35;
 t.lastX=e.clientX;t.lastY=e.clientY;
 const vx=Math.cos(state.aimTarget)*reachTarget+dx,vy=Math.sin(state.aimTarget)*reachTarget+dy;
 const d=Math.hypot(vx,vy);if(d<1)return;
 const a=Math.atan2(vy,vx);state.aimMoved+=Math.abs(Math.atan2(Math.sin(a-state.aimTarget),Math.cos(a-state.aimTarget)));
 state.aimTarget=a;reachTarget=clamp(d,MIN_REACH,MAX_REACH);
 }
 `);
 one('state.power=0;state.dragX=state.dragY=0;','state.power=0;state.dragX=state.dragY=0;reachTarget=reach;');
 one('function tickPhysics(dt){const oldY=p.y;','function tickPhysics(dt){const oldY=p.y;\n  if(!state.plant){\n   const sh=shoulder(),prev=caneFoot(),oldReach=reach;\n   const x=Math.cos(state.aim)*reach,y=Math.sin(state.aim)*reach;\n   let dx=Math.cos(state.aimTarget)*reachTarget-x,dy=Math.sin(state.aimTarget)*reachTarget-y;\n   const d=Math.hypot(dx,dy),k=d>0?Math.min(1,1800*dt/d):0;\n   const nx=x+dx*k,ny=y+dy*k;\n   state.aim=Math.atan2(ny,nx);reach=clamp(Math.hypot(nx,ny),MIN_REACH,MAX_REACH);\n   if(state.pointer!==null){\n    const tip=caneFoot();const n=Math.max(1,Math.ceil(Math.hypot(tip.x-prev.x,tip.y-prev.y)/6));\n    for(let i=1;i<=n;i++){const f=i/n,q={x:lerp(prev.x,tip.x,f),y:lerp(prev.y,tip.y,f)},hit=contactUnderFoot(q);if(!hit)continue;\n     const r=Math.hypot(hit.x-sh.x,hit.y-sh.y);if(r<MIN_REACH||r>MAX_REACH)continue;\n     state.plant={...hit,startX:p.x,startY:p.y,radius:r};state.lastContact=hit;state.aim=Math.atan2(hit.y-sh.y,hit.x-sh.x);reach=r;tone(440,.055,.05,250);break;\n    }\n   }\n  }');
 edit('  // Rate limited pivot','  const hvx=',`  // Halbae-style rate-limited relative vector. Fixed world tip, variable grip.
  const x=Math.cos(state.aim)*reach,y=Math.sin(state.aim)*reach;
  let dx=Math.cos(state.aimTarget)*reachTarget-x,dy=Math.sin(state.aimTarget)*reachTarget-y;
  const d=Math.hypot(dx,dy),k=d>0?Math.min(1,1800*dt/d):0;
  const xx=x+dx*k,yy=y+dy*k;
  const angle=Math.atan2(yy,xx),len=clamp(Math.hypot(xx,yy),MIN_REACH,MAX_REACH);
  const off=shoulderOffset();
  let nx=clamp(a.x-off.x-Math.cos(angle)*len,25,endX+180),ny=a.y-off.y-Math.sin(angle)*len;
  const floor=surfAt(nx);
  if(floor&&prevY+R<=floor.y+20&&ny+R>floor.y)ny=floor.y-R;
  // A higher roof's wall blocks entry until the wheels clear its top.
  if(floor&&nx>prevX&&prevX<floor.r.x&&prevY+R>floor.y+5&&ny+R>floor.y+5)nx=floor.r.x-1;
  p.x=nx;p.y=ny;
  const sh=shoulder(),ax=a.x-sh.x,ay=a.y-sh.y,actual=Math.hypot(ax,ay);
  if(actual<MIN_REACH-1||actual>MAX_REACH+1){p.x=prevX;p.y=prevY;nx=prevX;ny=prevY;}
  else {state.aim=Math.atan2(ay,ax);reach=actual;a.radius=actual;}
 `);
 one('p.angle=lerp(p.angle,clamp(-delta*.38,-.18,.18),Math.min(1,dt*9));','// Keep shoulder transform stable while the contact is planted.');
 one('state.aim=.88;state.aimTarget=.88;state.gesture=null','state.aim=.88;state.aimTarget=.88;reach=reachTarget=STICK_REACH;state.gesture=null');
 return s;
}
(async()=>{try{const r=await fetch("./v9-base.html",{cache:"no-cache"});if(!r.ok)throw Error("HTTP "+r.status);const s=patchHalmae(await r.text());document.open();document.write(s);document.close();}catch(e){document.getElementById("load").textContent="게임을 불러오지 못했어요. 새로고침해 주세요. ("+e.message+")";}})();
</script></body></html>
